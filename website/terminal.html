<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Terminal – SwampTag</title>
  <meta name="description" content="SwampTag payment terminal: runs on the phone and reads the key with NFC.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="term-body">
  <main class="term" id="term" aria-live="polite">
    <header class="term-top">
      <span class="logo">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#004977"/>
          <circle cx="10" cy="16" r="2.6" fill="#fff"/>
          <path d="M14.5 11.2a6.8 6.8 0 0 1 0 9.6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <path d="M18.8 7.4a12.2 12.2 0 0 1 0 17.2" stroke="#d03027" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        </svg>
        <span>Swamp<em>Tag</em></span>
      </span>
      <button class="term-flip" id="flip-btn" aria-label="Turn the screen upside down">⟲</button>
    </header>

    <section class="term-screen" id="screen"></section>

    <footer class="term-foot">
      <span class="badge badge-dot" id="nfc-status">Starting…</span>
      <div class="term-demo hidden" id="demo-buttons">
        <button class="btn btn-outline btn-sm" data-sim="good">Correct key</button>
        <button class="btn btn-outline btn-sm" data-sim="bad">Wrong key</button>
      </div>
    </footer>
  </main>

  <div class="term-start" id="start">
    <div>
      <h1>SwampTag terminal</h1>
      <p class="muted">Tap once to turn on the key reader, full screen and keep-awake.</p>
      <button class="btn btn-primary" id="start-btn">Start terminal</button>
    </div>
  </div>

  <script src="js/terminal.js"></script>
</body>
</html>
