<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Terminal – QuackTag</title>
  <meta name="description" content="QuackTag payment terminal: runs on the phone and reads the key with NFC.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="term-body">
  <main class="term" id="term" aria-live="polite">
    <header class="term-top">
      <span class="logo">
        <svg viewBox="0 0 32 32" aria-hidden="true">
  <rect width="32" height="32" rx="9" fill="#004977"/>
  <path d="M5.2 16.6c1.7 1.5 4.3 1.9 6.8 1.1 2.1-.7 3.6-2.1 6.3-2.1 3.9 0 6.6 2.7 6.6 5.8 0 3.6-3.6 5.9-9.4 5.9-6.4 0-10.6-3.9-10.3-10.7z" fill="#FFC83D"/>
  <path d="M10.6 20.2c2.4 2.2 6.2 2.4 8.6.6" stroke="#F5A623" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="18.6" cy="11.4" r="5.3" fill="#FFC83D"/>
  <path d="M23 9.9l5 1.4c.6.2.6 1 0 1.2l-5 1.5z" fill="#F28C1E"/>
  <circle cx="19.8" cy="10.3" r="1.15" fill="#13294b"/>
        </svg>
        <span>Quack<em>Tag</em></span>
      </span>
      <button class="term-flip" id="flip-btn" aria-label="Turn the screen upside down">⟲</button>
    </header>

    <section class="term-screen" id="screen"></section>

    <footer class="term-foot">
      <span class="badge badge-dot" id="nfc-status">Starting…</span>
      <div class="term-demo hidden" id="demo-buttons">
        <button class="btn btn-outline btn-sm" data-sim="good">Correct key</button>
        <button class="btn btn-outline btn-sm" data-sim="bad">Wrong key</button>
      </div>
    </footer>
  </main>

  <div class="term-start" id="start">
    <div>
      <h1>QuackTag terminal</h1>
      <p class="muted">Tap once to turn on the key reader, full screen and keep-awake.</p>
      <button class="btn btn-primary" id="start-btn">Start terminal</button>
    </div>
  </div>

  <script src="js/terminal.js"></script>
</body>
</html>
