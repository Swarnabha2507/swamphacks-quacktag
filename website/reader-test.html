<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reader test – SwampTag</title>
  <link rel="icon" href="favicon.svg">
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; color: #0b1f3a; margin: 0; padding: 32px 16px; }
    main { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 4px 20px rgba(11, 31, 58, 0.08); }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    .muted { color: #5b6b80; font-size: 0.9rem; margin: 0 0 20px; }
    button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: none; background: #0b5cff; color: #fff; cursor: pointer; }
    button:disabled { background: #b3bcc4; cursor: default; }
    .status { margin: 16px 0; font-weight: 600; }
    .status::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #b3bcc4; margin-right: 8px; }
    .status.on::before { background: #1f9d55; }
    .status.warn::before { background: #e5a100; }
    .result { text-align: center; border: 2px dashed #d5dbe3; border-radius: 14px; padding: 28px 12px; transition: background 0.2s, border-color 0.2s; }
    .result.good { background: #e8f7ee; border-color: #1f9d55; }
    .result.same { background: #fff6e0; border-color: #e5a100; }
    .result .big { font-size: 2.6rem; font-weight: 700; }
    .result .uid { font-family: ui-monospace, Consolas, monospace; font-size: 1.4rem; margin-top: 6px; }
    .log { margin-top: 20px; font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; background: #0b1f3a; color: #cfe1ff; border-radius: 10px; padding: 12px; height: 160px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>SwampTag reader test</h1>
    <p class="muted">Connect the Arduino, then tap a fob or card. Close Arduino IDE's Serial Monitor first. Works in Chrome or Edge.</p>
    <button id="connect">Connect reader</button>
    <div class="status" id="status">Not connected</div>
    <div class="result" id="result">
      <div class="big" id="big">Waiting for a tap…</div>
      <div class="uid" id="uid"></div>
      <div class="muted" id="count"></div>
    </div>
    <div class="log" id="log"></div>
  </main>

  <script src="js/serial.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const link = new SerialLink();
    let reads = 0;
    let lastUid = null; // ID of the previous tap, to spot the same key tapped again

    function log(text) {
      const time = new Date().toLocaleTimeString();
      $('log').textContent += `${time}  ${text}\n`;
      $('log').scrollTop = $('log').scrollHeight;
    }

    function setStatus(text, cls = '') {
      $('status').textContent = text;
      $('status').className = `status ${cls}`;
    }

    link.onStatus = (connected) => {
      $('connect').textContent = connected ? 'Disconnect' : 'Connect reader';
      // READY only prints when the board starts, so after a reconnect we may not see it again.
      setStatus(connected ? 'Connected: tap a tag' : 'Not connected', connected ? 'on' : '');
      log(connected ? 'Port opened' : 'Port closed');
    };

    link.onLine = (line) => {
      log(`← ${line}`);
      if (line === 'READY') setStatus('Reader ready: tap a tag', 'on');
      else if (line === 'ERROR:READER') setStatus('RC522 not detected: check the wiring (3.3V, D9–D13)', 'warn');
      else if (line.startsWith('TAG:')) {
        const uid = line.slice(4);
        const same = uid === lastUid;
        reads += 1;
        setStatus('Reader ready: tap a tag', 'on');
        $('result').className = same ? 'result same' : 'result good';
        $('big').textContent = same ? '↻ Same key as last time' : '✓ Read successfully';
        $('uid').textContent = uid;
        const note = !same && lastUid ? `New key (last one was ${lastUid}) · ` : '';
        $('count').textContent = `${note}${reads} tap${reads === 1 ? '' : 's'} so far`;
        if (same) log('same key');
        lastUid = uid;
        link.send('OK'); // show the check mark on the LED matrix too
        log('→ OK');
      }
    };

    $('connect').addEventListener('click', async () => {
      $('connect').disabled = true; // one open/close at a time
      try {
        if (link.connected) await link.disconnect();
        else await link.connect();
      } catch (err) {
        // NotFoundError = the port picker was closed without choosing.
        if (err.name !== 'NotFoundError') log(`Could not connect: ${err.message} (is Serial Monitor open?)`);
      } finally {
        $('connect').disabled = false;
      }
    });

    if (!SerialLink.supported()) {
      $('connect').disabled = true;
      setStatus('This browser cannot talk to USB devices. Open this page in Chrome or Edge.', 'warn');
    } else {
      link.reconnect(); // reopen a reader this page was allowed to use before
    }
  </script>
</body>
</html>
