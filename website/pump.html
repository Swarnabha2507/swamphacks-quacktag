<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pump 4 – Swamp Gas &amp; Go</title>
  <meta name="description" content="SwampTag gas-station checkout: choose items, pay with card, PIN and your SwampTag key.">
  <meta name="theme-color" content="#f3f5fa">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pump.css?v=2">
</head>
<body class="pump-body">
  <header class="pump-top">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5c-.4 0-.7.2-.9.5C9.4 5.6 6 10.4 6 14a6 6 0 0 0 12 0c0-3.6-3.4-8.4-5.1-11-.2-.3-.5-.5-.9-.5zm-2.6 12.2a.9.9 0 0 1 .9.9 1.9 1.9 0 0 0 1.9 1.9.9.9 0 0 1 0 1.8 3.7 3.7 0 0 1-3.7-3.7c0-.5.4-.9.9-.9z"/></svg>
    </div>
    <div class="brand-text">
      <strong>Swamp Gas &amp; Go</strong>
      <span>Pump 4 · Gainesville</span>
    </div>
    <span class="status-pill" id="nfc-status">Starting…</span>
    <button class="gear" id="setup-btn" aria-label="Pump setup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <ol class="pump-steps" id="steps" aria-label="Checkout steps">
    <li data-step="shop">Items</li>
    <li data-step="card">Card</li>
    <li data-step="pin">PIN</li>
    <li data-step="key">Key</li>
  </ol>

  <main class="pump-main" id="screen" aria-live="polite"></main>

  <div class="toast hidden" id="toast" role="status"></div>

  <div class="start" id="start">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5c-.4 0-.7.2-.9.5C9.4 5.6 6 10.4 6 14a6 6 0 0 0 12 0c0-3.6-3.4-8.4-5.1-11-.2-.3-.5-.5-.9-.5zm-2.6 12.2a.9.9 0 0 1 .9.9 1.9 1.9 0 0 0 1.9 1.9.9.9 0 0 1 0 1.8 3.7 3.7 0 0 1-3.7-3.7c0-.5.4-.9.9-.9z"/></svg>
    </div>
    <h1>Swamp Gas &amp; Go</h1>
    <p>Pump 4 is ready. Tap once to turn on the card reader.</p>
    <button class="pill pill-white" id="start-btn">Start pump</button>
  </div>

  <div class="sheet-backdrop hidden" id="setup">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setup-title">
      <div class="grabber"></div>
      <div class="sheet-head"><h2 id="setup-title">Pump setup</h2><button class="sheet-close" id="setup-close" aria-label="Close">×</button></div>
      <div id="setup-body"></div>
    </div>
  </div>

  <script src="js/pump.js?v=2"></script>
</body>
</html>
