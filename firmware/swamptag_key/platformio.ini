; SwampTag key device: Adafruit Feather RP2040 + RC522.
;   pio run -e key -t upload     rewrites the key fob every 15 s while it rests on the reader
;   pio run -e card -t upload    writes the static fake debit card (paired to a fob), once
;   pio device monitor           shows what it's doing (115200 baud)
; Wiring and colours: README.md in this folder.

[platformio]
default_envs = key

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    adafruit/Adafruit NeoPixel@^1.12.0
    rweather/Crypto@^0.4.0

[env:key]

[env:card]
build_flags = -D CARD_WRITER
